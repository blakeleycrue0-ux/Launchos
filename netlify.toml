[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Valores PÚBLICOS por diseño: acaban en el bundle del navegador y la seguridad
  # de los datos depende de RLS. Aquí nunca va la clave service_role ni sb_secret_.
  VITE_SUPABASE_URL = "https://plfnmdrrmwzrvthemraq.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_b_GwJDxsczn_FAJEoQ18rg_FrTbbSbn"

# SPA: todas las rutas las resuelve React Router.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
